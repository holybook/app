{{/* Source/target language selectors of the translation forms; dot is a translateForm. */}}
{{define "language-pair"}}
<div class="lang-pair">
  <label class="select">
    <span class="visually-hidden">From</span>
    <select name="from" data-lang-from>
      {{- range .Languages}}<option value="{{.}}"{{if eq . $.From}} selected{{end}}>{{langName .}}</option>{{end -}}
    </select>
    {{icon "chevron-down"}}
  </label>
  <button type="button" class="icon-button" data-swap-languages aria-label="Swap languages" title="Swap languages">{{icon "swap"}}</button>
  <label class="select">
    <span class="visually-hidden">To</span>
    <select name="to" data-lang-to>
      {{- range .Languages}}<option value="{{.}}"{{if eq . $.To}} selected{{end}}>{{langName .}}</option>{{end -}}
    </select>
    {{icon "chevron-down"}}
  </label>
</div>
{{end}}
