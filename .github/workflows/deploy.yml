name: Deploy

on:
  push:
    branches: [main]
  workflow_dispatch:

env:
  IMAGE: ghcr.io/${{ github.repository }}

jobs:
  test:
    uses: ./.github/workflows/ci.yml

  build:
    needs: test
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push image
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: |
            ${{ env.IMAGE }}:latest
            ${{ env.IMAGE }}:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  deploy:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: read
    steps:
      - uses: actions/checkout@v4

      # Copy the compose file, Caddyfile, content-sync script and DB init
      # script to ~/holybook on the droplet.
      - name: Copy deploy files
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.DROPLET_HOST }}
          username: ${{ secrets.DROPLET_USER }}
          key: ${{ secrets.DROPLET_SSH_KEY }}
          source: "deploy/compose.yaml,deploy/Caddyfile,deploy/sync-content.sh,deploy/db-init/*"
          target: holybook
          strip_components: 1

      - name: Render .env, pull image, restart and sync content
        uses: appleboy/ssh-action@v1.2.0
        env:
          GHCR_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GHCR_USER: ${{ github.actor }}
          HOLYBOOK_IMAGE: ${{ env.IMAGE }}:${{ github.sha }}
          SITE_ADDRESS: ${{ secrets.SITE_ADDRESS }}
          DB_PASSWORD: ${{ secrets.DB_PASSWORD }}
          WEBAPP_PASSWORD: ${{ secrets.WEBAPP_PASSWORD }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        with:
          host: ${{ secrets.DROPLET_HOST }}
          username: ${{ secrets.DROPLET_USER }}
          key: ${{ secrets.DROPLET_SSH_KEY }}
          envs: GHCR_TOKEN,GHCR_USER,HOLYBOOK_IMAGE,SITE_ADDRESS,DB_PASSWORD,WEBAPP_PASSWORD,GEMINI_API_KEY
          script: |
            set -euo pipefail
            cd ~/holybook
            umask 077
            cat > .env <<EOF
            SITE_ADDRESS=${SITE_ADDRESS}
            DB_PASSWORD=${DB_PASSWORD}
            WEBAPP_PASSWORD=${WEBAPP_PASSWORD}
            GEMINI_API_KEY=${GEMINI_API_KEY}
            HOLYBOOK_IMAGE=${HOLYBOOK_IMAGE}
            EOF
            chmod +x sync-content.sh db-init/*.sh
            echo "$GHCR_TOKEN" | docker login ghcr.io -u "$GHCR_USER" --password-stdin
            docker compose pull web
            docker compose up -d --remove-orphans
            # Reimports only if the content or the schema version changed.
            ./sync-content.sh
            docker image prune -f
