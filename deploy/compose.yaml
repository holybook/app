name: holybook

# Production stack for a single DigitalOcean droplet: Postgres, the holybook
# server, and Caddy (TLS + reverse proxy). The image is built and pushed by the
# deploy workflow; this file is copied to the droplet and run with a sibling
# .env that provides the secrets (see .env.example).

services:
  web:
    image: ${HOLYBOOK_IMAGE:-ghcr.io/holybook/app:latest}
    restart: unless-stopped
    command: ["serve"]
    environment:
      # The server only reads, so it connects as the least-privilege `webapp`
      # role (SELECT only). Credentials are passed separately from the URL, so
      # the password may contain any character.
      DATABASE_URL: "postgres://db:5432/holybook"
      DB_USER: webapp
      DB_PASSWORD: ${WEBAPP_PASSWORD:?set WEBAPP_PASSWORD in .env}
      GEMINI_API_KEY: ${GEMINI_API_KEY:-}
      LOG_FORMAT: json
    depends_on:
      db:
        condition: service_healthy
    mem_limit: 128m

  caddy:
    image: caddy:2-alpine
    restart: unless-stopped
    environment:
      SITE_ADDRESS: ${SITE_ADDRESS:-:80}
    ports:
      - "80:80"
      - "443:443"
    depends_on:
      - web
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    mem_limit: 96m

  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: holybook
      POSTGRES_USER: server
      POSTGRES_PASSWORD: ${DB_PASSWORD:?set DB_PASSWORD in .env}
      # Consumed by db-init/01-webapp-role.sh on first initialisation.
      WEBAPP_PASSWORD: ${WEBAPP_PASSWORD:?set WEBAPP_PASSWORD in .env}
    volumes:
      - db_data:/var/lib/postgresql/data
      - ./db-init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U server -d holybook"]
      interval: 5s
      timeout: 5s
      retries: 10
    mem_limit: 256m

  # One-off content importer, the same image as `web`. Not started by `up` (it
  # lives in the "tools" profile); invoked by sync-content.sh via
  # `docker compose run`. The content/ folder of the holybook/data clone is
  # mounted read-only.
  importer:
    image: ${HOLYBOOK_IMAGE:-ghcr.io/holybook/app:latest}
    profiles: ["tools"]
    restart: "no"
    entrypoint: ["/holybook", "import"]
    environment:
      # The importer writes, so it connects as the `server` owner role.
      DATABASE_URL: "postgres://db:5432/holybook"
      DB_USER: server
      DB_PASSWORD: ${DB_PASSWORD:?set DB_PASSWORD in .env}
    volumes:
      - ./data/content:/content:ro
    depends_on:
      db:
        condition: service_healthy

volumes:
  db_data:
  caddy_data:
  caddy_config:
